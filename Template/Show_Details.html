<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Records</title>

    <style>
        body {
            background: #f2f4f8;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #ffffff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .06);
        }

        th {
            background: #2563eb;
            color: white;
            text-align: left;
            padding: 12px 10px;
            font-size: 14px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
        }

        tr:hover {
            background: #f9fafb;
        }

        a {
            padding: 6px 10px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            margin-right: 6px;
        }

        .edit-btn {
            background: #22c55e;
            color: white;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
        }

        a:hover {
            opacity: .9;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Roll</th>
            <th>Branch</th>
            <th>Course</th>
            <th>Actions</th>
        </tr>

        {% for i in show_details %}
        <tr>
            <td>{{ i.name }}</td>
            <td>{{ i.Email }}</td>
            <td>{{ i.phone_no }}</td>
            <td>{{ i.roll_no }}</td>
            <td>{{ i.Branch }}</td>
            <td>{{ i.course }}</td>
            <td>
                <a class="edit-btn" href="{% url 'app:update_details' i.id %}">Edit</a>

                <a class="delete-btn" href="{% url 'app:delete_student' i.id %}"
                    onclick="return confirm('Are you sure you want to delete this record?');">
                    Delete
                </a>
            </td>
        </tr>
        {% endfor %}
    </table>

</body>

</html>
